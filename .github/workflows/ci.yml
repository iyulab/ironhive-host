name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'Directory.Build.targets'
      - '*.slnx'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (Unit tests only)
        # coverlet.MTP's --coverlet/--coverlet-output-format is MTP's equivalent of VSTest's
        # --collect "XPlat Code Coverage"; --filter-not-trait (repeated, ANDs together) is MTP's
        # equivalent of VSTest's compound "Category!=A&Category!=B" filter syntax;
        # --hangdump/--hangdump-timeout is the equivalent of --blame-hang.
        run: dotnet test --no-build --configuration Release --verbosity normal --coverlet --coverlet-output-format cobertura --results-directory ./coverage --filter-not-trait "Category=E2E" --filter-not-trait "Category=Integration" --filter-not-trait "Category=Benchmark" --hangdump --hangdump-timeout 5m

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        # Coverage upload is telemetry, not a gate: fail_ci_if_error does not cover a crash of the
        # action itself (a TLS handshake failure exited non-zero and blocked the release's CI check).
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
