name: Release

on:
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
  workflow_dispatch:
    inputs:
      skip_ci_check:
        description: 'Skip CI check (for manual releases)'
        required: false
        default: 'true'
        type: boolean

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Self-hosted releases on this public repo (ironhive-cli-releases retired 2026-07, archived read-only).
  RELEASE_REPO: iyulab/ironhive-host

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; every job below asks for what it needs.
permissions: {}

# The push to nuget.org is not made here. This workflow builds the CLI archives and the GitHub release, packs the NuGet packages,
# uploads them as an artifact and asks the organization's central publisher (iyulab/nuget-publish) to push them; that repository
# holds the only trusted-publishing policy and checks this repository, this workflow file and the package ids against an
# allowlist. No NuGet credential lives here.
jobs:
  # Wait for CI to pass first (skipped for manual workflow_dispatch)
  ci-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_ci_check != true }}
    steps:
      - name: Wait for CI
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'build (ubuntu-latest)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  # Extract version from Directory.Build.props
  version:
    needs: ci-check
    if: ${{ always() && (needs.ci-check.result == 'success' || needs.ci-check.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      is-prerelease: ${{ steps.get-version.outputs.is-prerelease }}
      release-exists: ${{ steps.check-release.outputs.exists }}
      nuget-exists: ${{ steps.check-nuget.outputs.exists }}
    steps:
      - uses: actions/checkout@v5

      - name: Get version from Directory.Build.props
        id: get-version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if prerelease (contains alpha, beta, rc, preview)
          if [[ "$VERSION" =~ (alpha|beta|rc|preview) ]]; then
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "Detected version: $VERSION"

      - name: Check if GitHub release already exists
        id: check-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.get-version.outputs.version }}
          if gh release view "v$VERSION" --repo ${{ env.RELEASE_REPO }} &>/dev/null; then
            echo "Release v$VERSION already exists in ${{ env.RELEASE_REPO }}"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Release v$VERSION does not exist in ${{ env.RELEASE_REPO }}"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if NuGet package already exists
        id: check-nuget
        run: |
          VERSION=${{ steps.get-version.outputs.version }}
          PACKAGE_ID="IronHive.Host"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID,,}/${VERSION}/${PACKAGE_ID,,}.${VERSION}.nupkg")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Package $PACKAGE_ID version $VERSION already exists on NuGet"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Package $PACKAGE_ID version $VERSION does not exist on NuGet"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  # Build and create GitHub Release
  # The tag and the GitHub release exist only for a version that reached nuget.org (or was already there): this job runs after
  # the central publish.
  release:
    needs: [version, publish]
    if: ${{ always() && needs.version.result == 'success' && needs.version.outputs.release-exists != 'true' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build for Windows x64
        run: |
          dotnet publish src/IronHive.Cli -c Release -r win-x64 \
            -o ./publish/win-x64

      - name: Build for Linux x64
        run: |
          dotnet publish src/IronHive.Cli -c Release -r linux-x64 \
            -o ./publish/linux-x64

      - name: Build for macOS x64
        run: |
          dotnet publish src/IronHive.Cli -c Release -r osx-x64 \
            -o ./publish/osx-x64

      - name: Build for macOS ARM64
        run: |
          dotnet publish src/IronHive.Cli -c Release -r osx-arm64 \
            -o ./publish/osx-arm64

      - name: Create archives
        run: |
          VERSION=${{ needs.version.outputs.version }}

          # Windows - zip without parent folder
          cd publish/win-x64
          zip -r ../../ironhive-${VERSION}-win-x64.zip .
          cd ../..

          # Linux/macOS - tar without parent folder
          tar -czvf ironhive-${VERSION}-linux-x64.tar.gz -C publish/linux-x64 .
          tar -czvf ironhive-${VERSION}-osx-x64.tar.gz -C publish/osx-x64 .
          tar -czvf ironhive-${VERSION}-osx-arm64.tar.gz -C publish/osx-arm64 .

      - name: Generate checksums
        run: |
          sha256sum ironhive-*.zip ironhive-*.tar.gz > checksums.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.version.outputs.version }}
          IS_PRERELEASE=${{ needs.version.outputs.is-prerelease }}

          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Release notes = this version's CHANGELOG.md section. Every iyulab publish workflow carries this awk program
          # verbatim; change it in all of them or in none. The install instructions follow it.
          awk -v v="$VERSION" '/^## /{if(p)exit;h=$0;sub(/^## +\[?v?/,"",h);c=substr(h,length(v)+1,1);if(index(h,v)==1&&(c==""||c=="]"||c==" "||c=="\t")){p=1;next}}p&&(n||$0!~/^[ \t]*$/){l[++n]=$0}END{while(n&&(l[n]~/^[ \t]*$/||l[n]~/^---+$/))n--;for(i=1;i<=n;i++)print l[i]}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; fi
          cat >> release-notes.md <<EOF

          ### Installation

          **Via dotnet tool (Recommended)**
          \`\`\`bash
          dotnet tool install -g IronHive.Cli
          \`\`\`

          **Windows (x64)**
          \`\`\`powershell
          Invoke-WebRequest -Uri "https://github.com/${{ env.RELEASE_REPO }}/releases/download/v$VERSION/ironhive-$VERSION-win-x64.zip" -OutFile ironhive.zip
          Expand-Archive ironhive.zip -DestinationPath .
          \`\`\`

          **Linux (x64)**
          \`\`\`bash
          curl -LO https://github.com/${{ env.RELEASE_REPO }}/releases/download/v$VERSION/ironhive-$VERSION-linux-x64.tar.gz
          tar -xzf ironhive-$VERSION-linux-x64.tar.gz
          chmod +x ironhive
          \`\`\`

          **macOS (Intel)**
          \`\`\`bash
          curl -LO https://github.com/${{ env.RELEASE_REPO }}/releases/download/v$VERSION/ironhive-$VERSION-osx-x64.tar.gz
          tar -xzf ironhive-$VERSION-osx-x64.tar.gz
          chmod +x ironhive
          \`\`\`

          **macOS (Apple Silicon)**
          \`\`\`bash
          curl -LO https://github.com/${{ env.RELEASE_REPO }}/releases/download/v$VERSION/ironhive-$VERSION-osx-arm64.tar.gz
          tar -xzf ironhive-$VERSION-osx-arm64.tar.gz
          chmod +x ironhive
          \`\`\`

          ### Update
          \`\`\`bash
          dotnet tool update -g IronHive.Cli
          \`\`\`
          EOF

          gh release create "v$VERSION" \
            --repo ${{ env.RELEASE_REPO }} \
            --title "IronHive CLI v$VERSION" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG \
            ironhive-*.zip \
            ironhive-*.tar.gz \
            checksums.sha256

  # Pack the NuGet packages and hand them to the central publisher below
  pack:
    needs: version
    if: ${{ always() && needs.version.result == 'success' && needs.version.outputs.nuget-exists != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Pack
        # Solution-unit pack (unified-version family): packs IronHive.Host (SDK) + IronHive.Host.Protocol
        # + IronHive.Cli (tool) together at the same version so the dependency closure (Host -> Protocol)
        # is complete. Test projects are IsPackable=false and excluded.
        run: dotnet pack IronHive.Host.slnx --configuration Release --output ./nupkg

      - name: List packages
        run: ls -la ./nupkg/

      # Only .nupkg and .snupkg files: the central publisher refuses an artifact that holds anything else.
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./nupkg/*.nupkg
            ./nupkg/*.snupkg
          if-no-files-found: error
          retention-days: 1

  # Asks the central publisher to push the packages and waits for its answer: this job succeeds only when they are on nuget.org.
  # Until the repository is on the publisher's allowlist the call is refused and the jobs after it do not run.
  publish:
    needs: pack
    if: ${{ always() && needs.pack.result == 'success' }}
    uses: iyulab/nuget-publish/.github/workflows/request.yml@2166748abf716fb58855228f65fc6b8f78c2780f # main
    permissions: {}
    secrets: inherit

  # Summary
  summary:
    needs: [version, release, pack, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ${{ needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NuGet Pack | ${{ needs.pack.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NuGet Publish (central) | ${{ needs.publish.result }} |" >> $GITHUB_STEP_SUMMARY
